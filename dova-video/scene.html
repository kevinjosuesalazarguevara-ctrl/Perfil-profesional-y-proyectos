<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>DOVA video</title>
<style>
  @font-face { font-family: 'Space Grotesk'; src: url("fonts/space-grotesk-latin-wght-normal.woff2") format("woff2"); font-weight: 300 700; }
  @font-face { font-family: Inter; src: url("fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #0B0B0B; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: #0B0B0B; }
  svg#art { position: absolute; inset: 0; }
  #cap { position: absolute; display: flex; align-items: center; justify-content: center; text-align: center; }
  #cap .line { font-family: 'Space Grotesk', sans-serif; font-weight: 700; line-height: 1.05; letter-spacing: -0.03em; color: #fff; text-wrap: balance; }
  #cap .w { display: inline-block; }
  #cap .on { color: #C7FF3D; }
  #foot { position: absolute; text-align: center; font: 500 34px Inter, sans-serif; color: #A1A1A1; letter-spacing: .02em; }
</style>
</head>
<body>
<div id="stage"><svg id="art"></svg><div id="cap"><div class="line" id="line"></div></div><div id="foot"></div></div>
<script>
const CFG = window.CFG, TL = window.TL, TX = TL.text;
const H = CFG.format === 'h';
const W = H ? 1920 : 1080, HT = H ? 1080 : 1920;
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = HT + 'px';
document.documentElement.style.width = W + 'px'; document.documentElement.style.height = HT + 'px';
const svg = document.getElementById('art');
svg.setAttribute('viewBox', `0 0 ${W} ${HT}`); svg.setAttribute('width', W); svg.setAttribute('height', HT);
const cap = document.getElementById('cap'), line = document.getElementById('line'), foot = document.getElementById('foot');
if (H) { Object.assign(cap.style, { left: '1000px', right: '60px', top: '0', height: '1080px' }); line.style.fontSize = '104px'; Object.assign(foot.style, { left: '1000px', right: '60px', bottom: '56px' }); }
else { Object.assign(cap.style, { left: '70px', right: '70px', top: '1180px', height: '420px' }); line.style.fontSize = '112px'; Object.assign(foot.style, { left: '0', right: '0', bottom: '150px' }); }
foot.textContent = TX.foot;

const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeIO = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const spring = (x) => { x = clamp(x); return 1 - Math.pow(1 - x, 3) * Math.cos(x * 9); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const win = (t, a, b, f = .25) => Math.min(ease(seg(t, a, a + f)), 1 - ease(seg(t, b - f, b)));
function el(tag, attrs = {}, parent = svg) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent.appendChild(n); return n; }
const txt = (s, attrs, parent) => { const n = el('text', { 'font-family': 'Space Grotesk', 'font-weight': 700, ...attrs }, parent); n.textContent = s; return n; };
const S = (id) => TL.scenes[id]?.start ?? 0, E = (id) => (TL.scenes[id] ? TL.scenes[id].start + TL.scenes[id].dur : 0);

// Fondo: rejilla fina del sistema de marca
const grid = el('g', { stroke: '#1E1E1E', 'stroke-width': 2 });
for (let x = -180; x <= W + 180; x += 90) el('line', { x1: x, y1: -180, x2: x, y2: HT + 180 }, grid);
for (let y = -180; y <= HT + 180; y += 90) el('line', { x1: -180, y1: y, x2: W + 180, y2: y }, grid);

// Grupo de arte (en horizontal se reduce y se coloca a la izquierda)
const art = el('g');
const artTf = H ? 'translate(40 40) scale(.9)' : '';
art.setAttribute('transform', artTf);

// 1. Logo con revelado
const gLogo = el('g', {}, art);
const cp = el('clipPath', { id: 'lc' }, gLogo); const cpRect = el('rect', { x: 180, y: 440, width: 0, height: 240 }, cp);
const logoImg = el('image', { href: 'assets/logo-inverse.svg', x: 180, y: 470, width: 720, height: 155, 'clip-path': 'url(#lc)' }, gLogo);
const logoLine = el('rect', { x: 180, y: 680, width: 0, height: 10, fill: '#C7FF3D' }, gLogo);

// 2. Web
const gWeb = el('g', {}, art);
el('rect', { x: 240, y: 380, width: 600, height: 440, rx: 28, fill: 'none', stroke: '#fff', 'stroke-width': 6 }, gWeb);
el('line', { x1: 240, y1: 460, x2: 840, y2: 460, stroke: '#fff', 'stroke-width': 6 }, gWeb);
[290, 340, 390].forEach((cx) => el('circle', { cx, cy: 420, r: 12, fill: '#fff' }, gWeb));
const webLime = el('rect', { x: 290, y: 520, width: 0, height: 150, rx: 16, fill: '#C7FF3D' }, gWeb);
const webL1 = el('rect', { x: 290, y: 710, width: 0, height: 20, rx: 10, fill: '#fff' }, gWeb);
const webL2 = el('rect', { x: 290, y: 755, width: 0, height: 20, rx: 10, fill: '#A1A1A1' }, gWeb);

// 3. Marca
const gBrand = el('g', {}, art);
const swatches = [['#C7FF3D', 'none'], ['#FFFFFF', 'none'], ['#1E1E1E', '#fff'], ['#A1A1A1', 'none']].map(([fill, stroke], i) => el('circle', { cx: 225 + i * 210, cy: 600, r: 0, fill, stroke, 'stroke-width': 6 }, gBrand));

// 4. Automatización
const gAuto = el('g', {}, art);
const nodes = [[240, 760], [540, 400], [840, 760]];
el('polygon', { points: nodes.map((p) => p.join(',')).join(' '), fill: 'none', stroke: '#fff', 'stroke-width': 6, 'stroke-linejoin': 'round' }, gAuto);
nodes.forEach(([cx, cy]) => el('circle', { cx, cy, r: 42, fill: '#0B0B0B', stroke: '#fff', 'stroke-width': 6 }, gAuto));
const runner = el('circle', { r: 26, fill: '#C7FF3D' }, gAuto);
const perimeter = (u) => { u = ((u % 1) + 1) % 1; const s = u * 3, i = Math.floor(s), f = s - i, a = nodes[i], b = nodes[(i + 1) % 3]; return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]; };

// 5. Idioma
const gLang = el('g', {}, art);
el('rect', { x: 270, y: 520, width: 540, height: 170, rx: 85, fill: '#1E1E1E' }, gLang);
const thumb = el('rect', { x: 282, y: 532, width: 260, height: 146, rx: 73, fill: '#C7FF3D' }, gLang);
const tES = txt('ES', { x: 412, y: 628, 'text-anchor': 'middle', 'font-size': 76, fill: '#0B0B0B' }, gLang);
const tEN = txt('EN', { x: 678, y: 628, 'text-anchor': 'middle', 'font-size': 76, fill: '#fff' }, gLang);

// 6. Servicios: cuatro filas que se dibujan
const gSvc = el('g', {}, art);
const rows = TX.services.map((label, i) => {
  const y = 340 + i * 150, g = el('g', {}, gSvc);
  const rect = el('rect', { x: 120, y, width: 840, height: 112, rx: 28, fill: '#C7FF3D', 'fill-opacity': 0, stroke: '#fff', 'stroke-width': 5, pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': 1 }, g);
  const dot = el('circle', { cx: 190, cy: y + 56, r: 24, fill: '#C7FF3D' }, g);
  const chk = el('path', { d: `M178 ${y + 56} l9 10 l17 -20`, fill: 'none', stroke: '#0B0B0B', 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  const t = txt(label, { x: 245, y: y + 72, 'font-size': 46, fill: '#fff' }, g);
  return { g, rect, dot, t, y, chk };
});

// 7. Proceso: línea de tiempo vertical
const gProc = el('g', {}, art);
const px = 250, py = [380, 580, 780, 980];
el('line', { x1: px, y1: py[0], x2: px, y2: py[3], stroke: '#1E1E1E', 'stroke-width': 10, 'stroke-linecap': 'round' }, gProc);
const pLine = el('line', { x1: px, y1: py[0], x2: px, y2: py[0], stroke: '#C7FF3D', 'stroke-width': 10, 'stroke-linecap': 'round' }, gProc);
const pNodes = py.map((y, i) => {
  const c = el('circle', { cx: px, cy: y, r: 34, fill: '#0B0B0B', stroke: '#fff', 'stroke-width': 6 }, gProc);
  const t = txt(TX.steps[i], { x: px + 80, y: y + 28, 'font-size': 84, fill: '#fff' }, gProc);
  return { c, t };
});

// 9. Línea que se endereza
const gLine = el('g', {}, art);
const path = el('polyline', { fill: 'none', stroke: '#C7FF3D', 'stroke-width': 16, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, gLine);
const dot = el('circle', { r: 26, fill: '#fff' }, gLine);
const NP = 90;
function drawLine(p, reveal) {
  const pts = [], shown = Math.floor(NP * reveal);
  for (let i = 0; i <= shown; i++) {
    const x = 110 + (860 * i) / NP, wob = Math.sin(i * .55) * 120 * (1 - p) * (.4 + .6 * Math.sin((i / NP) * Math.PI)), loop = Math.cos(i * .9) * 40 * (1 - p);
    pts.push(`${x.toFixed(1)},${(600 + wob + loop).toFixed(1)}`);
  }
  path.setAttribute('points', pts.join(' '));
  const last = pts[pts.length - 1].split(','); dot.setAttribute('cx', last[0]); dot.setAttribute('cy', last[1]);
}

// 10. Cierre con cursor
const gEnd = el('g', {}, art);
const sym = el('image', { href: 'assets/logo-symbol-inverse.svg', x: 380, y: 330, width: 320, height: 320 }, gEnd);
const pill = el('g', {}, gEnd);
el('rect', { x: 250, y: 740, width: 580, height: 150, rx: 75, fill: '#C7FF3D' }, pill);
txt(TX.btn, { x: 540, y: 838, 'text-anchor': 'middle', 'font-size': 66, fill: '#0B0B0B' }, pill);
const ripple = el('circle', { cx: 540, cy: 815, r: 0, fill: 'none', stroke: '#C7FF3D', 'stroke-width': 8 }, gEnd);
const cursor = el('path', { d: 'M0 0 L0 56 L15 43 L27 70 L40 64 L28 38 L48 38 Z', fill: '#fff', stroke: '#0B0B0B', 'stroke-width': 4, 'stroke-linejoin': 'round' }, gEnd);

// Transiciones: barrido lima entre actos
const wipeAt = ['web', 'lang', 'services', 'process', 'line', 'cta'].map((id) => S(id));
const wipe = el('rect', { x: -W * 1.3, y: 0, width: W * 1.2, height: HT, fill: '#C7FF3D' });

// Subtítulos estilo UGC con palabra activa
let shown = -1;
function setCaption(t) {
  const idx = TL.chunks.findIndex((c) => t >= c.a && t < c.b);
  if (idx !== shown) { shown = idx; line.innerHTML = idx < 0 ? '' : TX[TL.chunks[idx].key].split(' ').map((w) => `<span class="w">${w}</span>`).join(' '); }
  if (idx < 0) { line.style.opacity = 0; return; }
  const c = TL.chunks[idx], words = line.querySelectorAll('.w'), p = (t - c.a) / (c.b - c.a);
  words.forEach((w, i) => w.classList.toggle('on', p >= (i / words.length) * .9));
  const enter = ease(seg(t, c.a, c.a + .18));
  line.style.opacity = Math.min(enter, 1 - seg(t, c.b - .06, c.b));
  line.style.transform = `translateY(${(1 - enter) * 36}px) scale(${.94 + .06 * enter})`;
}

const sA = S('intro'), D = TL.duration;
window.render = function (t) {
  grid.setAttribute('transform', `translate(${-(t * 12) % 90} ${(t * 18) % 90})`);

  // logo: revelado de izquierda a derecha
  gLogo.setAttribute('opacity', win(t, 0, 4.4, .4));
  cpRect.setAttribute('width', 740 * easeIO(seg(t, .1, 1.0)));
  logoImg.setAttribute('transform', `translate(0 ${(1 - ease(seg(t, .1, .9))) * 40})`);
  logoLine.setAttribute('width', 720 * ease(seg(t, 1.0, 2.4)));

  // web
  let l = t - S('web'); gWeb.setAttribute('opacity', win(t, S('web'), E('web')));
  webLime.setAttribute('width', 500 * ease(seg(l, .2, .9))); webL1.setAttribute('width', 360 * ease(seg(l, .6, 1.2))); webL2.setAttribute('width', 260 * ease(seg(l, .8, 1.4)));
  // marca
  l = t - S('brand'); gBrand.setAttribute('opacity', win(t, S('brand'), E('brand'), .15));
  swatches.forEach((c, i) => c.setAttribute('r', 90 * spring(seg(l, .05 + i * .1, .55 + i * .1))));
  // automatización
  gAuto.setAttribute('opacity', win(t, S('auto'), E('auto'), .2));
  const run = perimeter((t - S('auto')) * .5); runner.setAttribute('cx', run[0]); runner.setAttribute('cy', run[1]);
  // idioma
  l = t - S('lang'); gLang.setAttribute('opacity', win(t, S('lang'), E('lang')));
  const m = ease(seg(l, .7, 1.2)); thumb.setAttribute('x', 282 + 246 * m);
  tES.setAttribute('fill', m < .5 ? '#0B0B0B' : '#fff'); tEN.setAttribute('fill', m < .5 ? '#fff' : '#0B0B0B');

  // servicios
  l = t - S('services'); gSvc.setAttribute('opacity', win(t, S('services'), E('services')));
  const svcCh = TL.chunks.filter((c) => ['svc1', 'svc2', 'svc3', 'svc4'].includes(c.key));
  rows.forEach((r, i) => {
    r.rect.setAttribute('stroke-dashoffset', 1 - ease(seg(l, .1 + .25 * i, .6 + .25 * i)));
    const c = svcCh[i], act = c && t >= c.a && t < c.b ? ease(seg(t, c.a, c.a + .15)) : (c && t >= c.b ? 0 : 0);
    r.rect.setAttribute('fill-opacity', act); r.t.setAttribute('fill', act > .5 ? '#0B0B0B' : '#fff'); r.dot.setAttribute('fill', act > .5 ? '#0B0B0B' : '#C7FF3D'); r.chk.setAttribute('stroke', act > .5 ? '#C7FF3D' : '#0B0B0B');
    r.g.setAttribute('transform', `translate(${(1 - ease(seg(l, .1 + .25 * i, .6 + .25 * i))) * -40} 0)`);
  });

  // proceso
  l = t - S('process'); gProc.setAttribute('opacity', win(t, S('process'), E('process')));
  const pCh = TL.chunks.filter((c) => ['p1', 'p2', 'p3', 'p4'].includes(c.key));
  const last = pCh.reduce((a, c, i) => (t >= c.a ? i : a), -1);
  const prog = last < 0 ? 0 : Math.min(3, last + seg(t, pCh[Math.max(0, last)].a, pCh[Math.max(0, last)].b));
  pLine.setAttribute('y2', py[0] + (py[3] - py[0]) * (prog / 3));
  pNodes.forEach((n, i) => { const on = last >= i; n.c.setAttribute('fill', on ? '#C7FF3D' : '#0B0B0B'); n.c.setAttribute('stroke', on ? '#C7FF3D' : '#fff'); n.t.setAttribute('fill', last === i ? '#C7FF3D' : '#fff'); n.t.setAttribute('opacity', 0.45 + 0.55 * (on ? 1 : 0)); });

  // línea
  l = t - S('line'); gLine.setAttribute('opacity', win(t, S('line'), E('line'), .2));
  drawLine(ease(seg(l, .3, 1.4)), ease(seg(l, .05, .7)));

  // cierre
  l = t - S('cta'); gEnd.setAttribute('opacity', win(t, S('cta'), D + .01, .3));
  sym.setAttribute('transform', `translate(0 ${(1 - ease(seg(l, .05, .7))) * 50})`);
  const cx = 900 - 360 * easeIO(seg(l, .25, 1.05)), cy = 1020 - 200 * easeIO(seg(l, .25, 1.05));
  cursor.setAttribute('transform', `translate(${cx} ${cy}) scale(${l > 1.1 && l < 1.25 ? .88 : 1})`);
  cursor.setAttribute('opacity', ease(seg(l, .2, .4)));
  const press = l > 1.1 && l < 1.3 ? .94 : 1 + .03 * Math.sin((l - 1.4) * 6) * seg(l, 1.4, 1.5);
  pill.setAttribute('transform', `translate(540 815) scale(${press}) translate(-540 -815)`);
  ripple.setAttribute('r', 150 * ease(seg(l, 1.1, 1.8))); ripple.setAttribute('opacity', 1 - seg(l, 1.1, 1.8));

  // barridos
  let wx = -W * 1.3;
  for (const b of wipeAt) { const p = seg(t, b - .25, b + .3); if (p > 0 && p < 1) wx = -W * 1.2 + (W * 2.4) * easeIO(p); }
  wipe.setAttribute('x', wx);

  setCaption(t);
  foot.style.opacity = win(t, .4, D - .2, .5) * .9;
};
window.render(0);
</script>
</body>
</html>
